<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GoalPilot AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #09090b;
      color: #fafafa;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #27272a;
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .logo {
      font-weight: 700;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #6366f1;
    }
    .streak {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 9999px;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .detected-box {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 14px;
    }
    .detected-title {
      font-size: 12px;
      color: #a1a1aa;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .detected-resource {
      font-size: 13px;
      font-weight: 600;
      color: #f4f4f5;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .btn {
      width: 100%;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 10px 14px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s;
    }
    .btn:hover { background: #4338ca; }
    .btn-secondary {
      background: #27272a;
      color: #e4e4e7;
      margin-top: 8px;
    }
    .btn-secondary:hover { background: #3f3f46; }
    .status-msg {
      margin-top: 10px;
      font-size: 11px;
      text-align: center;
      color: #10b981;
      display: none;
    }
    .coach-pill {
      margin-top: 14px;
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.25);
      border-radius: 6px;
      padding: 10px;
      font-size: 11px;
      color: #c7d2fe;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <span>🚀</span> GoalPilot AI
    </div>
    <div class="streak">🔥 14 Days</div>
  </div>

  <div class="detected-box">
    <div class="detected-title" id="platform-label">Active Learning Detected</div>
    <div class="detected-resource" id="resource-title">Detecting active tab...</div>
  </div>

  <button class="btn" id="import-btn">
    <span>📥</span> Import to GoalPilot
  </button>
  <button class="btn btn-secondary" id="open-dashboard-btn">
    Open Study War Room
  </button>

  <div class="status-msg" id="status-msg">✓ Synced to GoalPilot Active Goal!</div>

  <div class="coach-pill">
    <strong>David Goggins:</strong> "You're watching this lesson. Make sure you take notes and face the assessment after!"
  </div>

  <script src="popup.js"></script>
</body>
</html>
